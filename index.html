<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Landing Page</title>
    <link rel="stylesheet" href="css/5.css">
</head>

<body>

    <section id="header">
        <div class="container">
            <img src="./images/logo.png" class="logo" alt="Logo">
            <div class="header-text">
                <h1>Our purpose is to teach<br> and bring learning to people</h1>
                <span class="square"></span>
                <p>
                    Discover new opportunities to learn, develop your skills,
                    and expand your knowledge through accessible education
                    designed for everyone.
                </p>
                <button class="common-btn">Read More</button>
                <div class="line">
                    <span class="line-1"></span><br>
                    <span class="line-2"></span><br>
                    <span class="line-3"></span>
                </div>
            </div>
        </div>
    </section>
    
    <nav id="sideNav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Offers</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    
    <img src="./images/menu.png" id="menuBtn" alt="Menu">

<script>
    var menuBtn = document.getElementById("menuBtn");
    var sideNav = document.getElementById("sideNav");

    sideNav.style.right = "-250px";

    menuBtn.onclick = function () {
        if (sideNav.style.right === "-250px") {
            sideNav.style.right = "0";
        } else {
            sideNav.style.right = "-250px";
        }
    };
</script>

</body>

</html>
